<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Social Agent</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f7fb;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      color: #111827;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 15px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      margin-top: 12px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #response {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      min-height: 50px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🤖 AI Social Agent</h1>

    <p>Tell your agent what you want it to do.</p>

    <textarea id="command" placeholder="Example: Create a motivational post"></textarea>

    <button onclick="sendCommand()">Send Command</button>

    <div id="response">Waiting for your command...</div>
  </div>

  <script>
    async function sendCommand() {
      const command = document.getElementById("command").value;
      const responseBox = document.getElementById("response");

      if (!command.trim()) {
        responseBox.textContent = "Please enter a command.";
        return;
      }

      responseBox.textContent = "Processing... 🤖";

      try {
        const response = await fetch("/command", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ command })
        });

        const data = await response.json();

        responseBox.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        responseBox.textContent = "Something went wrong.";
      }
    }
  </script>
</body>
</html>
