<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Social Agent</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .header {
      margin-bottom: 25px;
    }

    .header h1 {
      margin-bottom: 8px;
      font-size: 28px;
    }

    .header p {
      color: #6b7280;
      margin: 0;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    textarea {
      width: 100%;
      height: 130px;
      resize: vertical;
      padding: 15px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }

    textarea:focus {
      border-color: #111827;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    #sendButton {
      background: #111827;
      color: white;
    }

    #voiceButton {
      background: #e5e7eb;
      color: #111827;
    }

    #voiceButton.listening {
      background: #dc2626;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 12px;
      font-size: 14px;
      color: #6b7280;
      min-height: 20px;
    }

    #response {
      margin-top: 20px;
      background: #f9fafb;
      border-radius: 12px;
      padding: 16px;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.6;
      min-height: 80px;
    }

    .example {
      margin-top: 20px;
      color: #6b7280;
      font-size: 14px;
    }

    .example div {
      background: #f3f4f6;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
      cursor: pointer;
    }

    .example div:hover {
      background: #e5e7eb;
    }

    @media (max-width: 500px) {
      .container {
        padding: 15px;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>🤖 AI Social Agent</h1>
      <p>Type or speak a command to your AI agent.</p>
    </div>

    <div class="card">

      <textarea
        id="command"
        placeholder="Type your command here...

Example:
Create a motivational post about never giving up."
      ></textarea>

      <div class="buttons">

        <button id="sendButton" onclick="sendCommand()">
          Send Command
        </button>

        <button id="voiceButton" onclick="toggleVoice()">
          🎤 Speak
        </button>

      </div>

      <div id="status" class="status">
        Ready.
      </div>

      <div id="response">
        Waiting for your command...
      </div>

      <div class="example">

        <strong>Try saying or typing:</strong>

        <div onclick="useExample('Create a motivational post about never giving up.')">
          Create a motivational post about never giving up.
        </div>

        <div onclick="useExample('What do you remember about my posting style?')">
          What do you remember about my posting style?
        </div>

        <div onclick="useExample('Find the latest AI news and create a professional X post about it.')">
          Find the latest AI news and create a professional X post about it.
        </div>

      </div>

    </div>

  </div>


<script>

  // ==========================================
  // ELEMENTS
  // ==========================================

  const commandBox = document.getElementById("command");
  const responseBox = document.getElementById("response");
  const statusBox = document.getElementById("status");
  const voiceButton = document.getElementById("voiceButton");
  const sendButton = document.getElementById("sendButton");


  // ==========================================
  // SEND COMMAND
  // ==========================================

  async function sendCommand() {

    const command = commandBox.value.trim();

    if (!command) {
      statusBox.textContent = "Please enter or speak a command.";
      return;
    }

    sendButton.disabled = true;

    statusBox.textContent = "Processing... 🤖";
    responseBox.textContent = "Your AI agent is thinking...";


    try {

      const response = await fetch("/command", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          command: command
        })

      });


      const data = await response.json();


      if (!response.ok) {

        throw new Error(
          data.error || "Request failed."
        );

      }


      // Show readable response

      if (data.response) {

        responseBox.textContent = data.response;

      } else {

        responseBox.textContent =
          JSON.stringify(data, null, 2);

      }


      statusBox.textContent = "Completed successfully ✅";


    } catch (error) {

      console.error(error);

      responseBox.textContent =
        "Something went wrong. Please try again.";

      statusBox.textContent =
        "Error: " + error.message;

    }


    sendButton.disabled = false;

  }


  // ==========================================
  // VOICE RECOGNITION
  // ==========================================

  let recognition = null;
  let listening = false;


  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.continuous = false;

    recognition.interimResults = true;

    recognition.lang = "en-US";


    recognition.onstart = function() {

      listening = true;

      voiceButton.classList.add("listening");

      voiceButton.textContent =
        "🔴 Listening...";

      statusBox.textContent =
        "Speak your command...";

    };


    recognition.onresult = function(event) {

      let transcript = "";

      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        transcript +=
          event.results[i][0].transcript;

      }


      commandBox.value = transcript;

    };


    recognition.onend = function() {

      listening = false;

      voiceButton.classList.remove("listening");

      voiceButton.textContent =
        "🎤 Speak";

      statusBox.textContent =
        "Voice command captured.";

    };


    recognition.onerror = function(event) {

      listening = false;

      voiceButton.classList.remove("listening");

      voiceButton.textContent =
        "🎤 Speak";

      statusBox.textContent =
        "Voice error: " + event.error;

    };

  } else {

    voiceButton.disabled = true;

    voiceButton.textContent =
      "🎤 Voice not supported";

    statusBox.textContent =
      "Your browser does not support voice recognition.";

  }


  // ==========================================
  // TOGGLE VOICE
  // ==========================================

  function toggleVoice() {

    if (!recognition) {

      alert(
        "Voice recognition is not supported by this browser."
      );

      return;

    }


    if (listening) {

      recognition.stop();

    } else {

      recognition.start();

    }

  }


  // ==========================================
  // EXAMPLE COMMAND
  // ==========================================

  function useExample(text) {

    commandBox.value = text;

    commandBox.focus();

  }


  // ==========================================
  // ENTER KEY
  // ==========================================

  commandBox.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendCommand();

      }

    }
  );

</script>

</body>
</html>
